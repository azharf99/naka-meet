name: Naka Meet CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Every one of these three used to be optional: PROJECT_STATE.md records
  # them passing locally, but nothing re-ran them before an image reached
  # :latest. build-and-deploy below now depends on all three, so a failing
  # test blocks the push instead of shipping silently.
  test-sfu:
    name: Test — Go SFU Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/sfu/go.mod

      - name: go vet
        working-directory: apps/sfu
        run: go vet ./...

      # -race is mandatory here (see TESTING_STRATEGY.md): the SFU router
      # and room manager share maps across goroutines by design, and a data
      # race is exactly the class of bug this project has hit repeatedly.
      - name: go test -race
        working-directory: apps/sfu
        run: go test -v -race ./...

  # TESTING_STRATEGY.md §5's L2 layer: a real Redis container (via
  # Testcontainers) behind RoomManager, and a real SDP offer/answer over the
  # live /ws/signaling endpoint — every other Go test in this repo passes
  # room.NewRoomManager(nil), which skips the Redis mirroring code path
  # entirely, so this is the only test that would ever catch a regression
  # there. Gated behind -tags=integration and its own job (rather than folded
  # into test-sfu above) because it needs a reachable Docker daemon — ubuntu-
  # latest GH-hosted runners have one natively, no extra setup required.
  test-sfu-integration:
    name: Test — Go SFU Integration (real Redis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/sfu/go.mod

      - name: go test -tags=integration
        working-directory: apps/sfu
        run: go test -tags=integration -run TestIntegration -v ./...

  test-frontend:
    name: Test — Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Typecheck + build
        working-directory: apps/frontend
        run: npm run build

      - name: Unit tests (Vitest)
        working-directory: apps/frontend
        run: npm test

  test-egress:
    name: Test — Egress Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/egress/package-lock.json

      - name: Install dependencies
        working-directory: apps/egress
        run: npm ci

      - name: Unit tests
        working-directory: apps/egress
        run: npm test

  # L3 layer (see TESTING_STRATEGY.md §5 and e2e/README.md): Playwright
  # drives 2+ separate browser contexts — standing in for separate
  # browsers/devices — against the actual containerized stack (real
  # signaling, real Redis, real Postgres, real SDP negotiation), the same
  # shape as the origin-mismatch bug (postmortem Issue 1) that
  # single-laptop manual testing couldn't catch. Depends on the three unit-
  # test jobs so an obviously broken PR fails fast without paying for a
  # full docker build + browser install first.
  test-e2e:
    name: Test — L3 Multi-Browser E2E
    runs-on: ubuntu-latest
    needs: [test-sfu, test-frontend, test-egress]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # docker-compose.yml's services declare `env_file: - .env`; .env is
      # gitignored and never checked out, so compose fails outright with
      # "env file .env not found" before docker-compose.e2e.yml's own
      # `env_file: - .env.e2e` override even gets a chance to matter — this
      # sidesteps needing to know whether the installed compose version
      # replaces or merges an overridden env_file list, by making the two
      # files identical so it can't matter either way.
      - name: Provide .env for compose (mirrors .env.e2e)
        run: cp .env.e2e .env

      - name: Build stack from source (not :latest)
        run: docker compose -p naka-meet-e2e -f docker-compose.yml -f docker-compose.e2e.yml build

      - name: Start stack
        run: docker compose -p naka-meet-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d

      - name: Wait for frontend to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "frontend never came up" >&2
          docker compose -p naka-meet-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stack logs (always, for debugging)
        if: always()
        run: docker compose -p naka-meet-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs

      - name: Tear down stack
        if: always()
        run: docker compose -p naka-meet-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v

  build-and-deploy:
    name: Build Image and Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test-sfu, test-sfu-integration, test-frontend, test-egress]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.ref == 'refs/heads/main' # Hanya jalankan saat push ke main, setelah semua test lulus

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build SFU dan Push ke Docker Hub
      uses: docker/build-push-action@v6
      with:
        context: ./apps/sfu
        file: ./apps/sfu/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-sfu:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend dan Push ke Docker Hub
      uses: docker/build-push-action@v6
      with:
        context: ./apps/frontend
        file: ./apps/frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Egress dan Push ke Docker Hub
      uses: docker/build-push-action@v6
      with:
        context: ./apps/egress
        file: ./apps/egress/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-egress:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max