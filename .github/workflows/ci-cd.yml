name: Naka Meet CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build Image and Deploy to VPS
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.ref == 'refs/heads/main' # Hanya jalankan saat push ke main

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build SFU dan Push ke Docker Hub
      uses: docker/build-push-action@v6
      with:
        context: ./apps/sfu
        file: ./apps/sfu/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-sfu:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend dan Push ke Docker Hub
      uses: docker/build-push-action@v6
      with:
        context: ./apps/frontend
        file: ./apps/frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Egress dan Push ke Docker Hub
      uses: docker/build-push-action@v6
      with:
        context: ./apps/egress
        file: ./apps/egress/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-egress:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max