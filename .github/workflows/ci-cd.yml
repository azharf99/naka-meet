name: Naka Meet CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'
    - name: Run Unit Tests SFU
      run: cd apps/sfu && go test -v ./...

  build-and-deploy:
    name: Build Image and Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.ref == 'refs/heads/main' # Hanya jalankan saat push ke main

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Set up QEMU (untuk multi-platform support jika diperlukan)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 1. Login ke Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 2. Build SFU dan Push ke Docker Hub
    - name: Build and Push Docker Image API
      uses: docker/build-push-action@v6
      with:
        context: ./apps/sfu
        file: ./apps/sfu/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-sfu:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 2. Build Frontend dan Push ke Docker Hub
    - name: Build and Push Docker Image API
      uses: docker/build-push-action@v6
      with:
        context: ./apps/frontend
        file: ./apps/frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 3. Build Egress dan Push ke Docker Hub
    - name: Build and Push Docker Image API
      uses: docker/build-push-action@v6
      with:
        context: ./apps/egress
        file: ./apps/egress/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/naka-meet-egress:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max