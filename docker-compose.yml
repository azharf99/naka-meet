services:
  postgres:
    image: postgres:16-alpine
    container_name: naka-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - naka_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nakameet -d nakameet" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: naka-redis
    ports:
      - "6379:6379"
    networks:
      - naka_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  sfu-backend:
    image: azharfa/naka-meet-sfu:latest
    container_name: naka-sfu
    ports:
      - "8080:8080"
      - "50000-50050:50000-50050/udp"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - naka_network
    # Relative CPU priority under contention (enforced by plain
    # docker-compose up via --cpu-shares; unlike deploy.resources
    # reservations below, this is NOT a Swarm-only construct). Recording
    # start launches a full Chromium + libx264 ffmpeg encode in
    # egress-worker, which can otherwise starve this process's WS read/write
    # loops for the whole room. 1024 vs egress-worker's 256 gives the SFU a
    # 4:1 priority edge exactly when it matters.
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  frontend:
    image: azharfa/naka-meet-frontend:latest
    container_name: naka-frontend
    ports:
      - "3000:3000"
    depends_on:
      - sfu-backend
    networks:
      - naka_network

  egress-worker:
    image: azharfa/naka-meet-egress:latest
    container_name: naka-egress
    env_file:
      - .env
    environment:
      - RECORDINGS_DIR=/usr/src/app/recordings
    volumes:
      - ./recordings:/usr/src/app/recordings
    depends_on:
      redis:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - naka_network
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

networks:
  naka_network:
    driver: bridge

volumes:
  pgdata:

