services:
  postgres:
    image: postgres:16-alpine
    container_name: naka-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - naka_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nakameet -d nakameet" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: naka-redis
    ports:
      - "6379:6379"
    networks:
      - naka_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  sfu-backend:
    image: azharfa/naka-meet-sfu:latest
    container_name: naka-sfu
    ports:
      - "8080:8080"
      - "50000-50050:50000-50050/udp"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - naka_network
    # Relative CPU priority under contention (enforced by plain
    # docker-compose up via --cpu-shares; unlike deploy.resources
    # reservations below, this is NOT a Swarm-only construct). Recording
    # start launches a full Chromium + libx264 ffmpeg encode in
    # egress-worker, which can otherwise starve this process's WS read/write
    # loops for the whole room. 1024 vs egress-worker's 256 gives the SFU a
    # 4:1 priority edge exactly when it matters.
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  frontend:
    image: azharfa/naka-meet-frontend:latest
    container_name: naka-frontend
    ports:
      - "3000:3000"
    depends_on:
      - sfu-backend
    networks:
      - naka_network

  egress-worker:
    image: azharfa/naka-meet-egress:latest
    container_name: naka-egress
    env_file:
      - .env
    environment:
      - RECORDINGS_DIR=/usr/src/app/recordings
    volumes:
      - ./recordings:/usr/src/app/recordings
    depends_on:
      redis:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - naka_network
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  # Optional TURN relay for participants whose network needs one (symmetric
  # NAT, most mobile carriers, restrictive corporate firewalls) — STUN
  # alone silently strands them, invisible when everyone testing is on the
  # same LAN. Opt-in via a Compose profile so a plain `docker-compose up`
  # never starts it or opens its ports: `docker-compose --profile turn up
  # --build`. Requires TURN_SECRET (and, for a real deployment,
  # TURN_EXTERNAL_IP) set in .env — see .env.example.
  turn:
    image: coturn/coturn:latest
    container_name: naka-turn
    profiles: ["turn"]
    env_file:
      - .env
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      # Relay port range coturn allocates a real UDP port from per active
      # relayed stream — kept modest for a single-VPS deployment. Widen if
      # many participants are simultaneously behind NATs that need relaying.
      - "49160-49200:49160-49200/udp"
    # $$ (not $) so Compose leaves these for the container's own shell to
    # expand at runtime from env_file's real values, instead of Compose
    # trying to interpolate them itself at compose-file parse time.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec turnserver -n --log-file=stdout
        --realm=$${TURN_REALM:-naka-meet.local}
        --use-auth-secret
        --static-auth-secret=$$TURN_SECRET
        --min-port=49160 --max-port=49200
        --no-cli --no-tls --no-dtls
        --listening-port=3478
        $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
    networks:
      - naka_network

networks:
  naka_network:
    driver: bridge

volumes:
  pgdata:

